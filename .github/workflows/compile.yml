name: 🔨 Compile and Generate PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'tex/**'
    tags:
      - '**'
  pull_request:
    paths:
      - 'tex/**'

env:
  PDF_NAME: Daniel-Wambua-CV.pdf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd lib && pip install -r requirements.txt

    - name: 📝 Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full latexmk

    - name: 📄 Generate PDF
      run: make

    - name: 📤 Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: resume-pdf
        path: web/static/downloads/${{ env.PDF_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🏷️ Determine Tag Name
      id: determine_tag
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        if [ -z "$TAG_NAME" ]; then
          echo "No tag name found from ref: $GITHUB_REF"
          exit 1
        fi
        echo "Using tag $TAG_NAME"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
    

    - name: 🔍 Check if release already exists
      id: check_release
      run: |
        if [ -z "$TAG_NAME" ]; then
          echo "No tag name found, skipping release check"
          exit 1
        fi  
        if gh release view "$TAG_NAME" > /dev/null 2>&1; then
          echo "Release for tag $TAG_NAME already exists."
          exit 1
        else
          echo "Tag is present, valid and no existing releases exist. Continuing with $TAG_NAME...."
        fi

    - name: 📤 Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: resume-pdf
        path: web/static/downloads/

    - name: 🔑 Set up GitHub CLI
      run: |
        echo "${{ secrets.BOT_TOKEN }}" | gh auth login --with-token

    - name: � Generate Release Notes
      id: release_notes
      run: |
        # Get the previous tag
        PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
        
        if [ -z "$PREV_TAG" ]; then
          # First release - show all commits
          CHANGELOG=$(git log --pretty=format:"- %s" | head -20)
        else
          # Show commits since previous tag
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s")
        fi
        
        # Create release notes
        NOTES="## What's New in $TAG_NAME
        
$CHANGELOG

## Downloads
- **Resume PDF**: Daniel-Wambua-CV.pdf
- **Source Code**: Available as source.zip

Generated on: $(date)
"
        
        # Write to output file and set output
        echo "$NOTES" > release_notes.txt
        echo "CHANGELOG=$(echo "$CHANGELOG")" >> $GITHUB_ENV
        
    - name: 📦 Create Source Archive
      run: |
        # Create a source archive excluding certain directories
        zip -r source.zip . \
          -x "node_modules/*" \
          ".git/*" \
          "web/build/*" \
          "web/.svelte-kit/*" \
          ".venv/*" \
          "*.zip" \
          ".env*" \
          "**/__pycache__/*"

    - name: 📄 Create GitHub Release
      run: |
        NOTES="## What's New in $TAG_NAME
        
### Changes
$CHANGELOG

### Assets
- **Resume PDF**: Compiled CV in PDF format
- **Source Code**: Complete project source code

Generated on: $(date +'%b %d, %Y')"
        
        gh release create $TAG_NAME \
          web/static/downloads/${{ env.PDF_NAME }} \
          source.zip \
          --title "Release $TAG_NAME" \
          --notes "$NOTES"
        
