name: 🔨 Compile and Generate PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

env:
  PDF_NAME: Daniel-Wambua-CV.pdf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd lib && pip install -r requirements.txt

    - name: 📝 Install LaTeX
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-latex-extra

    - name: 📄 Generate PDF
      run: make

    - name: 📤 Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: resume-pdf
        path: web/static/downloads/${{ env.PDF_NAME }}

    # Keep the deployed PDF in sync with the resume source: Vercel has no
    # LaTeX toolchain, so it deploys the committed artifact below.
    - name: 💾 Commit rebuilt PDF
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add web/static/downloads/${{ env.PDF_NAME }} tex/resume.tex web/generated/
        if git diff --cached --quiet; then
          echo "✅ Generated PDF matches the committed one - nothing to update"
        else
          # No [skip ci] here: GITHUB_TOKEN pushes never retrigger workflows,
          # but the commit must still fire the Vercel deploy webhook.
          git commit -m "chore: rebuild CV PDF from resume.yml"
          git push
          echo "✅ Committed fresh PDF - Vercel will redeploy with it"
        fi
